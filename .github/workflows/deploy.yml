name: Deploy Colosseum (Node.js 24 actions)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package static Colosseum website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          test -s _site/index.html
          tar --directory _site -cf "$RUNNER_TEMP/artifact.tar" .

      # upload-pages-artifact@v4 still bundles upload-artifact@v4 (Node 20).
      # Package the same tar directly using the Node 24-native uploader instead.
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
